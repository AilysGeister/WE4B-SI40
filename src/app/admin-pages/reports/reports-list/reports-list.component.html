<div>
  <h1>Signalements</h1>

  <div class="row mb-4 align-items-end">
    <div class="col-md-4">
      <label for="statusSelect" class="form-label font-weight-bold">Filtrer par statut :</label>
      <select
        id="statusSelect"
        class="form-select form-control"
        [(ngModel)]="selectedStatut"
        (change)="onFilterChange()">
        <option value="Tous">Tous</option>
        <option value="En attente">En attente</option>
        <option value="Validé">Validés</option>
        <option value="Refusé">Refusés</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="sortSelect" class="form-label font-weight-bold">Trier par date :</label>
      <select
        id="sortSelect"
        class="form-select form-control"
        [(ngModel)]="selectedSort"
        (change)="onFilterChange()">
        <option value="ID-ASC">ID Croissant</option>
        <option value="ID-DESC">ID Décroissant</option>
        <option value="ALPHA-ASC">Du plus ancien au plus récent</option>
        <option value="ALPHA-DESC">Du plus récent au plus ancien</option>
        <option value="DATE-ASC">Titre A → Z</option>
        <option value="DATE-DESC">Titre Z → A</option>
      </select>
    </div>
  </div>

  <table class="table table-striped" *ngIf="visibleReports.length != 0; else noReports">
    <thead>
      <tr>
        <th>ID</th><th>Titre</th><th>Auteur</th><th>Date</th><th>Réclamant</th><th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let report of visibleReports">
        <td>{{ report.id }}</td><td>{{ report.comment.title }}</td><td>{{ report.comment.author.username }}</td><td>{{ report.created_at | date:'dd/MM/yyyy hh:mm':'UTC +1'  }}</td><td>{{ report.complainant.username }}</td><td>{{ report.statut }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noReports><em>Aucuns signalements à afficher.</em></ng-template>
</div>
