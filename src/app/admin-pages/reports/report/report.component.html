<h1>Modérer {{ comment.title }}</h1>
<div class="row">
  <div class="col-sm-6 col-md-12 col-lg-6 comment">
    <h2>{{ comment.title }}</h2>
    <small>De: <a>{{ comment.author.username }}</a></small>
    <p>{{ comment.content }}</p>
    <hr>
    <div class="d-flex gap-2">
      <strong>Supprimer ?</strong>
      <button class="btn btn-primary" (click)="refuse()">Non</button>
      <button class="btn btn-danger" (click)="delete()">Oui</button>
    </div>
  </div>

  <div class="col-sm-6 col-md-12 col-lg-6">
    <h2>Liste des signalements:</h2>
    <table class="table table-striped">
      <tr>
        <th>ID</th><th>Date</th><th>Réclamant</th><th>Statut</th>
      </tr>
      <tr *ngFor="let report of reports">
        <td>{{ report.id }}</td><td>{{ comment.created_at|date:'dd/MM/yyyy hh:mm':'UTC +1' }}</td><td>{{ report.complainant.username }}</td><td>{{ report.statut }}</td>
      </tr>
    </table>
  </div>
</div>
